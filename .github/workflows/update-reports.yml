name: Update research reports

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 7시 = UTC 전날 22시 (일~목 22:00 UTC)
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape reports
        run: python scripts/scrape_reports.py --out reports.json

      - name: Scrape bio/robotics analyst reports (김승민, 서미화, 박선영 · '바이오/로보틱스' 버튼용)
        if: always()  # 김충현 CFA 리포트 수집이 실패해도 독립적으로 계속 시도
        run: python scripts/scrape_reports.py --authors "서미화,김승민,박선영" --out reports_bio.json

      - name: Scrape Telegram channel comments (t.me/globalmedtech · 리포트 코멘트 자동 매칭)
        if: always()  # reports.json이 이미 저장된 상태라면 위 스텝 성공 여부와 무관하게 시도
        run: python scripts/scrape_telegram_comments.py --channel globalmedtech --reports reports.json --out telegram_comments.json

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          # reports_bio.json/telegram_comments.json은 해당 스텝이 0건으로 실패하면 파일 자체가
          # 없을 수 있다(git add에 없는 파일을 넘기면 전체 스텝이 죽으므로 존재 확인 후 add).
          if [ -f reports_bio.json ]; then git add reports_bio.json; fi
          if [ -f telegram_comments.json ]; then git add telegram_comments.json; fi
          if git diff --cached --quiet -- reports.json reports_bio.json telegram_comments.json 2>/dev/null; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: reports.json/reports_bio.json/telegram_comments.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            # 다른 워크플로가 그 사이 먼저 push해서 main이 앞서 있으면 rebase 후 재시도
            # (여러 update-*.yml이 각자 다른 파일만 건드리므로 실제 충돌은 거의 없다).
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
