name: Company news briefs

# 산업·기업 뉴스 › 브리핑 › 기업 브리핑 — 최근 30일 기사 요약을 기업별로 정리(scripts/analyze_company_briefs.py).
# 주 1회 토요일 10:10 KST(= 토 01:10 UTC) — 뉴스 수집·요약은 평일에만 돌아 주말엔
# Gemini 하루 한도를 나눠 쓰지 않는다. 기사 구성이 지난주와 같은 기업은 다시 만들지 않는다.
on:
  schedule:
    - cron: "10 1 * * 6"
  workflow_dispatch:
    inputs:
      only:
        description: "이 기업만(기사 co 표기 그대로, 예: 씨어스). 비우면 전체"
        required: false
        default: ""
      force:
        description: "기사 구성이 같아도 다시 정리"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  briefs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Build company briefs
        env:
          GEMINI_API_KEY_CONCALL: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          GEMINI_API_KEY_EARNINGS: ${{ secrets.GEMINI_API_KEY_EARNINGS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          ARGS=""
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/analyze_company_briefs.py $ARGS

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f company_briefs.json ]; then echo "생성된 파일 없음"; exit 0; fi
          git add company_briefs.json
          if git diff --cached --quiet -- company_briefs.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: 기업 브리핑 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then echo "푸시 성공"; exit 0; fi
              echo "푸시 실패, 재시도 $i/5"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            exit 1
          fi
