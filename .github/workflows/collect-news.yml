name: Collect news

# 2026-09-03: 원래 update-news.yml 하나로 "수집 + Gemini 요약/브리핑"을 다 처리했는데,
# Gemini 쪽이 하루 쿼터(20회) 초과로 실패할 때마다 재시도하려면 이미 잘 되는 수집(스크래핑)
# 까지 통째로 다시 돌려야 해서 비효율적이었다(사용자 피드백). 그래서 Gemini를 전혀 쓰지 않는
# "수집" 단계만 이 워크플로로 분리했다 — 실패할 일이 거의 없고 빠르다. Gemini를 쓰는
# "AI 처리"(요약/아카이빙/월간 브리핑)는 process-news.yml로 분리해서, 이 워크플로가 끝나면
# workflow_run으로 자동으로 이어서 실행되게 했다(그래야 항상 최신 news.json을 대상으로 돈다).
# AI 처리만 재시도하고 싶으면 수집을 다시 안 돌리고 process-news.yml만 수동 실행(workflow_dispatch)
# 하면 된다.

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 6시 7분 = UTC 전날 21시 7분. 국내(네이버 API) + 해외(RSS)를
    # 한 워크플로에서 순서대로 실행해 같은 news.json에 대한 두 워크플로의 git push 충돌을 없앴다.
    # 분(minute)을 정각에서 살짝 비껴 잡은 이유: GitHub Actions는 매시 정각(0분)에 스케줄 실행이
    # 몰려 지연/드롭될 확률이 높다고 공식 문서에서 안내함 -> 혼잡을 피하려 07분으로 이동 (2026-08-28).
    - cron: "7 21 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch domestic news (Naver API)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/scrape_news.py --out news.json

      - name: Fetch global news (RSS, no API key needed)
        if: always()  # 국내(네이버 API) 수집이 실패해도 해외 RSS 수집은 독립적으로 계속 시도
        run: python scripts/scrape_news_global.py --out news.json

      - name: "Fetch global news (Google 뉴스 검색 보강, md 가이드라인 site: 검색 방식, 무료·API 키 불필요)"
        if: always()  # RSS 결과는 이미 저장된 상태 — 이 단계가 실패해도 RSS 결과 그대로 유지
        run: python scripts/scrape_news_global_gsearch.py --out news.json

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet -- news.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: news.json 자동 수집 ($(date -u +%Y-%m-%d))"
            # 다른 워크플로가 그 사이 먼저 push해서 main이 앞서 있으면 rebase 후 재시도
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
