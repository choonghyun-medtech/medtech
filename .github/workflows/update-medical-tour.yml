name: Update medical tour data

on:
  schedule:
    # 한국관광데이터랩은 매월 11일경 전월분을 갱신(카드사 집계 반영). 기준일은 매월 12일
    # (11일 다음날)이지만, 11일이 주말/공휴일이면 실제 갱신도 그 다음 영업일로 밀리므로
    # 12~15일 4일 창(window)으로 매일 시도한다 — 이 스크립트는 매번 전체 시계열을 다시
    # 받아오고 변경분이 없으면 커밋을 건너뛰므로(idempotent), 창 안에서 며칠을 중복 실행해도
    # 무해하고, 갱신일이 며칠 밀려도 놓치지 않는다. 시간은 다른 update-*.yml과 겹치지 않는
    # 애매한 분(07:00 정각처럼 겹치기 쉬운 시각 회피)으로 KST 06:52 = 21:52 UTC(전날).
    - cron: "52 21 11,12,13,14 * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-medical-tour:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch medical tour data (한국관광 데이터랩)
        run: python scripts/scrape_medical_tour.py --out medical_tour.json

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f medical_tour.json ]; then
            echo "medical_tour.json이 아직 없음 — 커밋할 것 없음"
            exit 0
          fi
          git add medical_tour.json
          if git diff --cached --quiet -- medical_tour.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: medical_tour.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
