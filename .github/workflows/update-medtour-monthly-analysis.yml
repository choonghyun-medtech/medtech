name: Update medtour monthly analysis

on:
  # 2026-11-02: 매월 16일 고정 실행(schedule)을 없앴다 — 이제 수집 워크플로(update-medical-tour.yml,
  # 매월 12~15일)가 실제로 새 달 수치를 받은 날 바로 이어서 이 워크플로를 실행한다
  # (scripts/monthly_analysis_pending.py로 판단, 수치가 안 들어온 날은 건너뜀 — 사용자 요청).
  # 방한외국인(visitor_stats.json) 분석은 갱신 시차가 더 길어 별도 워크플로
  # (update-visitor-monthly-analysis.yml, update-visitor-stats.yml이 이어서 실행)로 분리돼 있다 —
  # 같이 돌리면 방한외국인 데이터를 기다리느라 이 의료관광 소비 분석까지 지연되기 때문(사용자 지적).
  workflow_dispatch:  # Actions 탭에서 수동 실행 — 기간을 비우면 평소처럼 최신 달 1개만 분석
    inputs:
      months:
        description: "과거 달 분석(선택): 예) 2026-06~2026-08 또는 2026-06,2026-07 — 이미 있는 달은 건너뜀"
        required: false
        default: ""

permissions:
  contents: write

# 방한외국인 분석(update-visitor-monthly-analysis.yml)과 같은 파일에 쓰므로 둘이 동시에 돌지 않고
# 차례로 돌게 한다(2026-10-13 — 과거 달 분석을 연달아 수동 실행할 때 푸시 충돌 방지).
concurrency:
  group: medtour-monthly-analysis-file
  cancel-in-progress: false

jobs:
  update-medtour-monthly-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai anthropic

      - name: Analyze medtour monthly highlights (Gemini 무료 티어 우선)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_EARNINGS: ${{ secrets.GEMINI_API_KEY_EARNINGS }}  # 예비 키 — 첫 키 하루 쿼터 소진 시 자동 전환(2026-10-13)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHS: ${{ github.event.inputs.months }}
        run: python scripts/analyze_medtour_monthly.py --data medical_tour.json --out medtour_monthly_analysis.json --months "$MONTHS"

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f medtour_monthly_analysis.json ]; then
            echo "medtour_monthly_analysis.json이 아직 없음(키 미등록 또는 유의미한 변동 없음) — 커밋할 것 없음"
            exit 0
          fi
          git add medtour_monthly_analysis.json
          if git diff --cached --quiet -- medtour_monthly_analysis.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: medtour_monthly_analysis.json 자동 갱신 (의료관광, $(date -u +%Y-%m-%d))"
            # update-visitor-monthly-analysis.yml도 같은 파일(다른 달 키 또는 같은 달의
            # 다른 섹션)에 쓸 수 있어 rebase 재시도가 특히 중요하다.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
