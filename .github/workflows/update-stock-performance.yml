name: Update stock performance

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 6시 53분 = UTC 전날 21시 53분 (일~목 21:53 UTC)
    # 매시 10분 단위 스케줄 혼잡을 피하려 53분으로 이동.
    # 2026-09-22: 8시 데드라인 확보를 위해 전체 파이프라인을 앞당기고 ir/fx-rate 뒤 순서로 재배치.
    # 미국 정규장 마감(서머타임 KST 05:00 / 표준시 KST 06:00) 이후 최소 53분의 여유를 두어
    # 종가 데이터 반영 시점을 확보 (추가로 as_of 검증+1회 재조회 로직도 적용돼 있음).
    - cron: "53 21 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-stock-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Fetch stock performance
        run: python scripts/scrape_stock_performance.py --tickers scripts/tickers.json --out stock_performance.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_performance.json
          if git diff --cached --quiet -- stock_performance.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: stock_performance.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            # 다른 워크플로가 그 사이 먼저 push해서 main이 앞서 있으면 rebase 후 재시도
            # (여러 update-*.yml이 각자 다른 파일만 건드리므로 실제 충돌은 거의 없다).
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
