name: Update news (global)

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 8시 = UTC 전날 23시. update-news(국내) 다음 순서.
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-news-global:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch global news (RSS, no API key needed)
        run: python scripts/scrape_news_global.py --out news.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet -- news.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: news.json(해외) 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
