name: Update earnings IR summaries

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 7시 40분 = UTC 전날 22시 40분 (일~목 22:40 UTC).
    # 2026-09-14: 기존 "1-5"(UTC 월~금)는 자정을 넘기는 스케줄(UTC 전날→KST 당일)인데
    # 요일을 하루 당겨서 지정하지 않아, 실제로는 KST 화~토요일에 돌고 정작 월요일엔
    # 안 도는 버그였다(사용자 리포트로 발견) — 다른 daily 워크플로(news/calendar/reports/
    # stock-performance/investor-flow)와 동일하게 "0-4"(UTC 일~목)로 수정.
    - cron: "40 22 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-earnings-ir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 google-genai anthropic

      - name: Fetch & translate earnings IR press releases (SEC EDGAR 8-K/6-K Exhibit 99, Gemini 무료 티어 우선)
        env:
          # 뉴스 요약/월간 브리핑과 GEMINI_API_KEY 하루 쿼터를 나눠 쓰다 소진되는 문제가
          # 있어(2026-09-08), 이 스크립트 전용 무료 키를 GEMINI_API_KEY_EARNINGS로 따로
          # 등록해두면 우선 쓴다(secrets에 아직 등록 전이면 빈 값이라 기존 GEMINI_API_KEY로
          # 자동 대체됨 — scripts/scrape_earnings_ir.py의 get_provider() 참고).
          GEMINI_API_KEY_EARNINGS: ${{ secrets.GEMINI_API_KEY_EARNINGS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scrape_earnings_ir.py --out earnings_ir.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_ir.json
          if git diff --cached --quiet -- earnings_ir.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: earnings_ir.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
