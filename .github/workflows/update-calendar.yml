name: Update event calendar

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 6시 45분 = UTC 전날 21시 45분 (일~목 21:45 UTC)
    # 다른 update-*.yml 스케줄(06:07/07:13/07:26/07:34/07:51)과 겹치지 않는 시간대로 선정.
    - cron: "45 21 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests curl_cffi

      - name: Fetch global earnings calendar (18개 팔로업 기업, yfinance 기반 · 무료)
        run: python scripts/scrape_calendar_global.py --out calendar_events.json

      - name: Fetch domestic DART calendar
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        # DART_API_KEY 시크릿이 아직 등록되지 않았으면 스크립트가 domestic 항목을
        # 건드리지 않고 조용히 종료한다(스크립트 자체 주석 참고).
        run: python scripts/scrape_calendar_domestic.py --out calendar_events.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar_events.json
          if git diff --cached --quiet -- calendar_events.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: calendar_events.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            # 다른 워크플로가 그 사이 먼저 push해서 main이 앞서 있으면 rebase 후 재시도
            # (여러 update-*.yml이 각자 다른 파일만 건드리므로 실제 충돌은 거의 없다).
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
