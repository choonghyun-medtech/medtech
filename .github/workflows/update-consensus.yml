name: Update consensus

on:
  schedule:
    # KST 06:04 (평일) = 21:04 UTC (일~목, 전날).
    # 2026-10-02: 원래 KST 17:20에 혼자 돌았는데, 다른 일일 갱신과 같은 새벽 파이프라인으로 편입.
    # 다른 파일에 의존하지 않으므로 reports(05:54)와 ir(06:17) 사이 빈 슬롯에 배치했다.
    - cron: "4 21 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-consensus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 yfinance

      - name: Extract consensus
        run: python scripts/scrape_consensus.py --tickers scripts/tickers.json --out consensus.json

      # 컨센서스 리비전 추적용 — 오늘 스냅샷을 consensus_history.json에 날짜별로 누적
      # (이력 파일이 아직 없으면 git 히스토리의 과거 consensus.json으로 처음부터 재구성).
      - name: Append consensus history
        run: |
          if [ -f consensus_history.json ]; then
            python scripts/update_consensus_history.py
          else
            git fetch --unshallow || true
            python scripts/update_consensus_history.py --backfill
          fi

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add consensus.json consensus_history.json
          if git diff --cached --quiet -- consensus.json consensus_history.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: consensus.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
