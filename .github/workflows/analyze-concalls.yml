name: Analyze concall transcripts

# 해외기업 컨콜 원문(TIKR, concall_transcripts/)을 한국어 정리본 + 지난 분기 대비 시계열 분석으로
# 만들어 concall_analysis/에 저장한다(scripts/analyze_concall_transcripts.py, 2026-10-15).
# - 원문을 새로 올리면(update_concall_transcripts.bat → push) 바로 돈다.
# - 하루 쿼터가 모자라 다 못 끝낸 원문은 매일 09:30 KST(쿼터가 09:00 KST에 초기화된 직후)에 이어서 처리한다.
# - Actions 탭에서 수동 실행도 가능(특정 편만 다시 분석할 때 only/force 사용).

# [2026-10-15] 샘플(UNH 2Q→3Q)로 형식을 확인한 뒤 자동 실행을 켰다 — 원문 push 시 + 매일 09:30 KST.
# 이미 분석된 원문은 건너뛰므로(원문 파일이 바뀐 경우만 다시 분석) 매일 돌아도 쿼터를 쓰지 않는다.
on:
  push:
    branches: [main]
    paths:
      - "concall_transcripts/**"
      - "scripts/analyze_concall_transcripts.py"
      - ".github/workflows/analyze-concalls.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "이 원문만 처리(파일명에서 .json 뺀 것, 예: UNH_2026Q3). 비우면 아직 분석 안 된 것 전부"
        required: false
        default: ""
      force:
        description: "이미 분석된 것도 다시 분석"
        type: boolean
        default: false
      max:
        description: "이번 실행 최대 편수(원문 1편 = Gemini 호출 1번)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: analyze-concalls
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Analyze transcripts (Gemini 무료 티어 — 컨콜 전용 키 우선, 소진 시 실적 IR 키)
        env:
          GEMINI_API_KEY_CONCALL: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          GEMINI_API_KEY_EARNINGS: ${{ secrets.GEMINI_API_KEY_EARNINGS }}
        run: |
          ARGS="--max ${{ github.event.inputs.max || '10' }}"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/analyze_concall_transcripts.py $ARGS

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add concall_analysis
          if git diff --cached --quiet -- concall_analysis; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: 컨콜 분석 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
