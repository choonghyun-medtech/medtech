name: Update HIRA procedure statistics

on:
  schedule:
    # 사용자 지정 기준일은 매월 2일(2026-11-04 3일→2일 변경). 다만 그 날짜가 주말/공휴일이면
    # HIRA 갱신도 그 다음 영업일로 밀릴 수 있어 KST 2~5일 4일 창(window)으로 매일 시도한다 —
    # 이 스크립트도 매번 전체 시계열을 다시 받고 변경 없으면 커밋을 건너뛰므로(idempotent) 창
    # 안에서 중복 실행해도 무해하다. 시간은 다른 update-*.yml과 겹치지 않는 애매한 분(07:00
    # 정각 회피)으로 KST 07:18 = 22:18 UTC(전날) — 그래서 cron 날짜는 KST보다 하루 앞선 1~4일.
    - cron: "18 22 1,2,3,4 * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-hira-procedure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch HIRA procedure statistics (opendata.hira.or.kr)
        run: python scripts/scrape_hira_procedure.py --out hira_procedure.json

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f hira_procedure.json ]; then
            echo "hira_procedure.json이 아직 없음 — 커밋할 것 없음"
            exit 0
          fi
          git add hira_procedure.json
          if git diff --cached --quiet -- hira_procedure.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: hira_procedure.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
