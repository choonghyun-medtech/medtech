name: Update earnings surprise

on:
  # 국내 다음 분기 컨센서스를 consensus.json에서 보충하므로, 별도 시각 대신 컨센서스 워크플로가
  # 끝나는 즉시 이어서 돈다(컨센서스가 늦게 끝나도 순서가 꼬이지 않음).
  workflow_run:
    workflows: ["Update consensus"]
    types: [completed]
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-earnings-surprise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Extract earnings surprise
        run: python scripts/scrape_earnings_surprise.py --tickers scripts/tickers.json --out earnings_surprise.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_surprise.json
          if git diff --cached --quiet -- earnings_surprise.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: earnings_surprise.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
