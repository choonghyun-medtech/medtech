name: Update export data

on:
  schedule:
    # 관세청 자료가 매월 15일경 전월분까지 확정되므로 기준일은 매월 16일. 다만 15일이
    # 주말/공휴일이면 확정도 그 다음 영업일로 밀릴 수 있어 16~19일 4일 창(window)으로
    # 매일 시도한다 — 이 스크립트도 매번 전체 시계열을 다시 받고 변경 없으면 커밋을
    # 건너뛰므로(idempotent) 창 안에서 중복 실행해도 무해하다. 시간은 다른 update-*.yml과
    # 겹치지 않는 애매한 분(07:00 정각 회피)으로 KST 07:03 = 22:03 UTC(전날).
    - cron: "3 22 15,16,17,18 * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트/백필 가능

permissions:
  contents: write

jobs:
  update-export-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch export data (관세청 수출입무역통계 · 공공데이터포털)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/scrape_export_data.py --out export_data.json

      - name: Commit changes if any
        if: always()  # DATA_GO_KR_SERVICE_KEY 미등록 시 스크립트가 0으로 종료하며 파일을 안 건드릴 수 있음
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f export_data.json ]; then
            echo "export_data.json이 아직 없음(서비스키 미등록 등) — 커밋할 것 없음"
            exit 0
          fi
          git add export_data.json
          if git diff --cached --quiet -- export_data.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: export_data.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
