name: Update export data

on:
  schedule:
    # 관세청 자료가 매월 15일경 전월분까지 확정되므로 매월 16일 KST 07:00 = 15일 22:00 UTC에 실행.
    # (수출 데이터 자체가 월 단위로만 갱신되므로 news/reports처럼 매일 돌릴 필요가 없다.)
    - cron: "0 22 15 * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트/백필 가능

permissions:
  contents: write

jobs:
  update-export-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch export data (관세청 수출입무역통계 · 공공데이터포털)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/scrape_export_data.py --out export_data.json

      - name: Commit changes if any
        if: always()  # DATA_GO_KR_SERVICE_KEY 미등록 시 스크립트가 0으로 종료하며 파일을 안 건드릴 수 있음
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f export_data.json ]; then
            echo "export_data.json이 아직 없음(서비스키 미등록 등) — 커밋할 것 없음"
            exit 0
          fi
          git add export_data.json
          if git diff --cached --quiet -- export_data.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: export_data.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
