name: Update news

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 6시 = UTC 전날 21시. 국내(네이버 API) + 해외(RSS)를
    # 한 워크플로에서 순서대로 실행해 같은 news.json에 대한 두 워크플로의 git push 충돌을 없앴다.
    - cron: "0 21 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser google-genai anthropic

      - name: Fetch domestic news (Naver API)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/scrape_news.py --out news.json

      - name: Fetch global news (RSS, no API key needed)
        if: always()  # 국내(네이버 API) 수집이 실패해도 해외 RSS 수집은 독립적으로 계속 시도
        run: python scripts/scrape_news_global.py --out news.json

      - name: Summarize news ([맥락] ~했음. / 2줄 요약, Gemini 무료 티어 우선)
        if: always()  # 요약 생성이 실패해도 기사 목록 자체는 이미 저장된 상태를 유지
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize_news.py --out news.json

      - name: Archive today's news into news_history.jsonl (뉴스 탭 내 '뉴스 플로우' 섹션용 누적)
        if: always()  # news.json이 이미 저장된 상태라면 요약 성공 여부와 무관하게 아카이빙
        run: python scripts/archive_news_snapshot.py --news news.json --history news_history.jsonl

      - name: Commit changes if any
        if: always()  # 셋 중 하나만 성공해도 그 결과는 커밋되도록
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json news_history.jsonl
          if git diff --cached --quiet -- news.json news_history.jsonl; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: news.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            # 다른 워크플로가 그 사이 먼저 push해서 main이 앞서 있으면 rebase 후 재시도
            # (여러 update-*.yml이 각자 다른 파일만 건드리므로 실제 충돌은 거의 없다).
            for i in 1 2 3 4 5; do
              if git push; then
                echo "푸시 성공"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/5 (원격 변경사항 반영 후 재시도)"
              git fetch origin main
              git rebase origin/main || { echo "리베이스 충돌, 수동 확인 필요"; exit 1; }
              sleep $((RANDOM % 6 + 2))
            done
            echo "5회 재시도에도 푸시 실패"
            exit 1
          fi
