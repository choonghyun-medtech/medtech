name: Update news

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 7시 50분 = UTC 전날 22시 50분
    - cron: "50 22 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch news (Naver API)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/scrape_news.py --out news.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet -- news.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "chore: news.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
