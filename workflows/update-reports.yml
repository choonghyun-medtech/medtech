name: Update research reports

on:
  schedule:
    # 매일 평일(KST 월~금) 오전 7시 = UTC 전날 22시 (일~목 22:00 UTC)
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

jobs:
  update-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape reports
        run: python scripts/scrape_reports.py --out reports.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- reports.json; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git add reports.json
            git commit -m "chore: reports.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
